# /etc/nginx/sites-available/olaspaddle.duckdns.org
# Sitio estático (sin proxy ni puertos): nginx del host sirve /opt/boletin-olas/_site.
# El HTTPS lo añade certbot del host: sudo /opt/certbot-venv/bin/certbot --nginx -d olaspaddle.duckdns.org
server {
    listen 80;
    listen [::]:80;
    server_name olaspaddle.duckdns.org;

    root /opt/boletin-olas/_site;
    index index.html;

    # Solo lectura.
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }

    # La página no usa nada de terceros salvo Open-Meteo (oleaje, viento y mareas).
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https://marine-api.open-meteo.com https://api.open-meteo.com; img-src 'self' data:; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Los archivos no llevan hash en el nombre y dhn.json cambia cada hora: siempre revalidar.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https://marine-api.open-meteo.com https://api.open-meteo.com; img-src 'self' data:; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        try_files $uri $uri/ =404;
    }

    location = /data/dhn.json {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
}
