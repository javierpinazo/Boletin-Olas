name: Publicar

on:
  schedule:
    - cron: '30 10 * * *' # 10:30 UTC = 05:30 hora de Lima
  workflow_dispatch: # botón "Run workflow" para correrlo a demanda
  push:
    branches: [main]
    paths: ['site/**', 'scripts/**', '.github/workflows/publicar.yml']

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Pruebas
        run: npm test

      - name: Leer el DHN
        if: github.event_name != 'push'
        run: npm run dhn

      - name: Guardar dhn.json
        if: github.event_name != 'push'
        run: |
          git config user.name "boletin-olas[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add data/dhn.json
          git commit -m "datos: dhn.json $(date -u +%Y-%m-%dT%H:%MZ)" || echo "sin cambios"
          # Si main avanzó durante la corrida (un push tuyo), se rebasa encima antes de empujar.
          git pull --rebase origin main
          git push

      - name: Armar el sitio
        run: npm run build

      - uses: actions/configure-pages@v5
        id: pages
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
