name: Publicar

# Publicación OPCIONAL en GitHub Pages, solo a mano ("Run workflow"). La app corre en la VPS (olas.veripago.pe, ver
# deploy/vps/) y allí n8n lee el DHN cada hora; este flujo ya no se programa ni commitea datos al repo.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Pruebas
        run: npm test

      - name: Leer el DHN
        run: npm run dhn

      - name: Armar el sitio
        run: npm run build

      - uses: actions/configure-pages@v5
        id: pages
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
